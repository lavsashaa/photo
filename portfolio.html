<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
    // ===== БЛОКИРОВКА ЗУМА СТРАНИЦЫ =====
    // 1. Ctrl + колесо мыши (десктоп)
    document.addEventListener('wheel', (e) => {
        if (e.ctrlKey) e.preventDefault();
    }, { passive: false });

    // 2. Ctrl + / Ctrl - / Ctrl 0 (десктоп)
    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) {
            e.preventDefault();
        }
    });

    // 3. Pinch-zoom на Safari (iOS)
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('gesturechange', (e) => e.preventDefault());
    document.addEventListener('gestureend', (e) => e.preventDefault());

    // 4. Двойной тап на мобиле — отключаем через touch (не мешает клику)
    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) e.preventDefault();
        lastTouchEnd = now;
    }, { passive: false });

    // Telegram
    if (window.Telegram && window.Telegram.WebApp) {
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    }

    // Бургер
    const burger = document.getElementById('burger');
    const menu = document.getElementById('menu');
    if (burger && menu) {
        burger.addEventListener('click', () => menu.classList.toggle('open'));
    }

    const headerEl = document.getElementById('header');
    window.addEventListener('scroll', () => {
        if (headerEl) headerEl.classList.toggle('scrolled', window.scrollY > 50);
    }, { passive: true });

    // ===== ПРЕДЗАГРУЗКА ФОТО — чтобы не «моргали» при скролле вверх =====
    // Заменяем loading="lazy" на eager после того, как фото появилось впервые
    const galleryImgs = document.querySelectorAll('.gallery-item img');
    if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    // Загружаем сразу, помечаем как eager — браузер не будет перезагружать
                    img.loading = 'eager';
                    img.decoding = 'async';
                    observer.unobserve(img);
                }
            });
        }, {
            rootMargin: '300px'  // начинаем загрузку за 300px до появления
        });

        galleryImgs.forEach((img) => observer.observe(img));
    }

    // ===== ЛАЙТБОКС с FLIP-анимацией =====
    const items = Array.from(document.querySelectorAll('.gallery-item'));
    const lightbox = document.getElementById('lightbox');
    const lbBackdrop = document.getElementById('lb-backdrop');
    const lbStage = document.getElementById('lb-stage');
    const lbImg = document.getElementById('lb-img');
    const lbClose = document.getElementById('lb-close');
    const lbPrev = document.getElementById('lb-prev');
    const lbNext = document.getElementById('lb-next');

    let current = 0;
    let touchStartX = 0;
    let touchEndX = 0;
    let isAnimating = false;

    const DUR = {
        open: 380,
        close: 320,
        slideOut: 180,
        slideIn: 220
    };

    function preloadImages(index) {
        for (let offset = -2; offset <= 2; offset++) {
            const i = (index + offset + items.length) % items.length;
            const img = new Image();
            img.src = items[i].dataset.src;
        }
    }

    function getThumbRect(index) {
        const thumb = items[index].querySelector('img');
        return thumb.getBoundingClientRect();
    }

    function scrollToThumb(index) {
        const item = items[index];
        const rect = item.getBoundingClientRect();
        const vh = window.innerHeight;

        if (rect.top >= 0 && rect.bottom <= vh) return;

        const targetY = window.scrollY + rect.top - (vh / 2) + (rect.height / 2);

        window.scrollTo({
            top: targetY,
            behavior: 'smooth'
        });
    }

    function openLightbox(index) {
        if (isAnimating) return;
        isAnimating = true;

        current = index;
        const thumbRect = getThumbRect(index);
        const vw = window.innerWidth;
        const vh = window.innerHeight;

        lightbox.classList.add('open');
        document.body.style.overflow = 'hidden';

        lbImg.src = items[current].dataset.src;
        preloadImages(current);

        lbStage.style.transition = 'none';
        lbStage.style.transform = `translate(${thumbRect.left + thumbRect.width / 2 - vw / 2}px, ${thumbRect.top + thumbRect.height / 2 - vh / 2}px) scale(${thumbRect.width / vw})`;
        lbStage.style.opacity = '0';

        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                lbStage.style.transition = `transform ${DUR.open}ms cubic-bezier(0.22, 1, 0.36, 1), opacity ${DUR.open - 80}ms ease`;
                lbStage.style.transform = 'translate(0, 0) scale(1)';
                lbStage.style.opacity = '1';
                setTimeout(() => { isAnimating = false; }, DUR.open);
            });
        });
    }

    function closeLightbox() {
        if (isAnimating) return;
        isAnimating = true;

        document.body.style.overflow = '';
        scrollToThumb(current);

        setTimeout(() => {
            const thumbRect = getThumbRect(current);
            const vw = window.innerWidth;
            const vh = window.innerHeight;

            lbStage.style.transition = `transform ${DUR.close}ms cubic-bezier(0.4, 0, 0.2, 1), opacity ${DUR.close - 60}ms ease`;
            lbStage.style.transform = `translate(${thumbRect.left + thumbRect.width / 2 - vw / 2}px, ${thumbRect.top + thumbRect.height / 2 - vh / 2}px) scale(${thumbRect.width / vw})`;
            lbStage.style.opacity = '0';

            setTimeout(() => {
                lightbox.classList.remove('open');
                lbStage.style.transition = 'none';
                lbStage.style.transform = 'none';
                lbStage.style.opacity = '1';
                isAnimating = false;
            }, DUR.close);
        }, 80);
    }

    function changePhoto(direction) {
        if (isAnimating) return;
        isAnimating = true;

        const shift = direction === 'next' ? -70 : 70;

        lbStage.style.transition = `transform ${DUR.slideOut}ms ease, opacity ${DUR.slideOut}ms ease`;
        lbStage.style.transform = `translate(${shift}px, 0) scale(0.98)`;
        lbStage.style.opacity = '0';

        setTimeout(() => {
            if (direction === 'next') {
                current = (current + 1) % items.length;
            } else {
                current = (current - 1 + items.length) % items.length;
            }
            lbImg.src = items[current].dataset.src;
            preloadImages(current);

            lbStage.style.transition = 'none';
            lbStage.style.transform = `translate(${-shift}px, 0) scale(0.98)`;
            lbStage.style.opacity = '0';

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    lbStage.style.transition = `transform ${DUR.slideIn}ms cubic-bezier(0.22, 1, 0.36, 1), opacity ${DUR.slideIn}ms ease`;
                    lbStage.style.transform = 'translate(0, 0) scale(1)';
                    lbStage.style.opacity = '1';
                    setTimeout(() => { isAnimating = false; }, DUR.slideIn);
                });
            });
        }, DUR.slideOut);
    }

    items.forEach((item, i) => {
        item.addEventListener('click', () => openLightbox(i));
    });

    lbClose.addEventListener('click', closeLightbox);
    lbBackdrop.addEventListener('click', closeLightbox);
    lbNext.addEventListener('click', () => changePhoto('next'));
    lbPrev.addEventListener('click', () => changePhoto('prev'));

    document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('open')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowRight') changePhoto('next');
        if (e.key === 'ArrowLeft') changePhoto('prev');
    });

    lightbox.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    lightbox.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchStartX - touchEndX;
        if (Math.abs(diff) > 50) {
            if (diff > 0) changePhoto('next');
            else changePhoto('prev');
        }
    });
</script>
