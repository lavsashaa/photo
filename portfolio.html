<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
    // ===== Telegram =====
    if (window.Telegram && window.Telegram.WebApp) {
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    }

    // ===== Бургер =====
    const burger = document.getElementById('burger');
    const menu = document.getElementById('menu');
    if (burger && menu) {
        burger.addEventListener('click', () => menu.classList.toggle('open'));
    }

    // ===== Скролл-эффект шапки =====
    const headerEl = document.getElementById('header');
    if (!document.documentElement.classList.contains('is-telegram')) {
        window.addEventListener('scroll', () => {
            if (headerEl) headerEl.classList.toggle('scrolled', window.scrollY > 50);
        }, { passive: true });
    }

    // ===== Анимация долгого нажатия =====
    (function() {
        const isTouch = window.matchMedia('(hover: none)').matches;
        if (!isTouch) return;

        const HOLD_TIME = 300;

        function setupLongPress(selector) {
            document.querySelectorAll(selector).forEach(function(el) {
                let timer = null;

                function startPress(e) {
                    if (e.touches && e.touches.length > 1) return;
                    timer = setTimeout(function() {
                        el.classList.add('pressed');
                    }, HOLD_TIME);
                }

                function cancelPress() {
                    if (timer) {
                        clearTimeout(timer);
                        timer = null;
                    }
                    setTimeout(function() {
                        el.classList.remove('pressed');
                    }, 150);
                }

                el.addEventListener('touchstart', startPress, { passive: true });
                el.addEventListener('touchend', cancelPress, { passive: true });
                el.addEventListener('touchcancel', cancelPress, { passive: true });
                el.addEventListener('touchmove', cancelPress, { passive: true });
                el.addEventListener('mousedown', startPress);
                el.addEventListener('mouseup', cancelPress);
                el.addEventListener('mouseleave', cancelPress);
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            setupLongPress('.btn');
            setupLongPress('.cta-btn');
        });
    })();

    // ===== Блокировка контекстного меню =====
    document.addEventListener('contextmenu', function(e) {
        if (e.target.closest('a')) {
            // Для галереи — блокируем, PhotoSwipe перехватит
            e.preventDefault();
        }
    });
</script>

<!-- ===== PhotoSwipe 5 ===== -->
<script src="https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/umd/photoswipe.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/umd/photoswipe-lightbox.umd.min.js"></script>
<script>
    (function() {
        if (typeof PhotoSwipeLightbox === 'undefined') {
            console.error('PhotoSwipe не загрузился');
            return;
        }

        const lightbox = new PhotoSwipeLightbox({
            gallery: '.gallery',
            children: 'a',
            pswpModule: PhotoSwipe,

            showHideAnimationType: 'zoom',
            showAnimationDuration: 333,
            hideAnimationDuration: 333,
            zoomAnimationDuration: 333,

            maxZoomLevel: 4,
            secondaryZoomLevel: 1.5,
            wheelToZoom: true,
            pinchToClose: true,

            bgOpacity: 0.95,
            spacing: 0.12,
            allowPanToNext: true,
            loop: true,
            preloaderDelay: 0,

            closeTitle: 'Закрыть',
            zoomTitle: 'Увеличить',
            arrowPrevTitle: 'Назад',
            arrowNextTitle: 'Вперёд',

            counter: true,
            indexIndicatorSep: ' / ',

            returnFocus: true,
        });

        // ===== Скролл к миниатюре ТОЛЬКО при закрытии =====
        lightbox.on('afterInit', function() {
            const pswp = lightbox.pswp;

            pswp.on('close', function() {
                const index = pswp.currIndex;
                const thumbnails = document.querySelectorAll('.gallery-item');
                const currentThumb = thumbnails[index];
                if (!currentThumb) return;

                const rect = currentThumb.getBoundingClientRect();
                const vh = window.innerHeight;
                const padding = 150;

                const isVisible = rect.top >= -padding && rect.bottom <= vh + padding;

                if (!isVisible) {
                    const targetY = window.scrollY + rect.top - (vh / 2) + (rect.height / 2);
                    window.scrollTo({ top: targetY, behavior: 'auto' });
                }
            });
        });

        lightbox.init();

        // Убираем target="_blank" — PhotoSwipe перехватывает клик
        document.querySelectorAll('.gallery-item').forEach(function(a) {
            a.removeAttribute('target');
            a.removeAttribute('rel');
        });
    })();
</script>
