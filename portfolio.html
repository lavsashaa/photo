    <script>
        // ===== Предзагрузка фото — убираем «моргание» при скролле вверх =====
        document.addEventListener('DOMContentLoaded', function () {
            const imgs = document.querySelectorAll('.gallery-item img');

            if ('IntersectionObserver' in window) {
                const observer = new IntersectionObserver(function (entries) {
                    entries.forEach(function (entry) {
                        if (entry.isIntersecting) {
                            const img = entry.target;
                            // Меняем lazy на eager — браузер больше не выгружает фото
                            img.loading = 'eager';
                            img.decoding = 'async';
                            observer.unobserve(img);
                        }
                    });
                }, {
                    rootMargin: '400px'   // начинаем за 400px до появления
                });

                imgs.forEach(function (img) {observer.observe(img);});
            } else {
                // Fallback для старых браузеров
                imgs.forEach(function (img) {img.loading = 'eager';});
            }
        });
    </script>

    <!-- ===== PhotoSwipe 5 ===== -->
    <script src="https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/umd/photoswipe.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/umd/photoswipe-lightbox.umd.min.js"></script>
    <script>
        (function () {
            if (typeof PhotoSwipeLightbox === 'undefined') {
                console.error('PhotoSwipe не загрузился');
                return;
            }

            const lightbox = new PhotoSwipeLightbox({
                gallery: '.gallery',
                children: 'a',
                pswpModule: PhotoSwipe,

                showHideAnimationType: 'zoom',
                showAnimationDuration: 333,
                hideAnimationDuration: 333,
                zoomAnimationDuration: 333,

                maxZoomLevel: 4,
                secondaryZoomLevel: 1.5,
                wheelToZoom: true,
                pinchToClose: true,

                bgOpacity: 0.95,
                spacing: 0.12,
                allowPanToNext: true,
                loop: true,
                preloaderDelay: 0,

                closeTitle: 'Закрыть',
                zoomTitle: 'Увеличить',
                arrowPrevTitle: 'Назад',
                arrowNextTitle: 'Вперёд',

                counter: true,
                indexIndicatorSep: ' / ',

                returnFocus: true,
            });

            // ===== Скролл к миниатюре ТОЛЬКО при закрытии =====
            lightbox.on('afterInit', function () {
                const pswp = lightbox.pswp;

                pswp.on('close', function () {
                    // Индекс фото, на котором закрыли лайтбокс
                    const index = pswp.currIndex;

                    const thumbnails = document.querySelectorAll('.gallery-item');
                    const currentThumb = thumbnails[index];
                    if (!currentThumb) return;

                    // Смотрим, видна ли миниатюра на экране (с запасом)
                    const rect = currentThumb.getBoundingClientRect();
                    const vh = window.innerHeight;
                    const padding = 150;

                    const isVisible = rect.top >= -padding && rect.bottom <= vh + padding;

                    if (!isVisible) {
                        // Мгновенный скролл — чтобы анимация закрытия шла в видимую область
                        const targetY = window.scrollY + rect.top - (vh / 2) + (rect.height / 2);
                        window.scrollTo({top: targetY, behavior: 'auto'});
                    }
                });
            });

            lightbox.init();

            // Убираем target="_blank" — PhotoSwipe перехватывает клик
            document.querySelectorAll('.gallery-item').forEach(function (a) {
                a.removeAttribute('target');
                a.removeAttribute('rel');
            });
        })();
    </script>

    <script>
        // ===== Анимация долгого нажатия (только на мобильных) =====
        (function() {
            // Работает только на устройствах без курсора (тач)
            const isTouch = window.matchMedia('(hover: none)').matches;
            if (!isTouch) return;

            const HOLD_TIME = 300; // мс — сколько держать палец

            function setupLongPress(selector) {
                const elements = document.querySelectorAll(selector);

                elements.forEach(function(el) {
                    let timer = null;
                    let pressed = false;

                    function startPress(e) {
                        // Не срабатываем при мультитаче (зум)
                        if (e.touches && e.touches.length > 1) return;

                        pressed = false;
                        timer = setTimeout(function() {
                            el.classList.add('pressed');
                            pressed = true;
                        }, HOLD_TIME);
                    }

                    function cancelPress() {
                        if (timer) {
                            clearTimeout(timer);
                            timer = null;
                        }
                        // Убираем анимацию с небольшой задержкой, чтобы её было видно
                        setTimeout(function() {
                            el.classList.remove('pressed');
                        }, 150);
                    }

                    el.addEventListener('touchstart', startPress, { passive: true });
                    el.addEventListener('touchend', cancelPress, { passive: true });
                    el.addEventListener('touchcancel', cancelPress, { passive: true });
                    el.addEventListener('touchmove', cancelPress, { passive: true });

                    // Также для стилуса / мыши (Safari с трекпадом и т.п.)
                    el.addEventListener('mousedown', startPress);
                    el.addEventListener('mouseup', cancelPress);
                    el.addEventListener('mouseleave', cancelPress);
                });
            }

            document.addEventListener('DOMContentLoaded', function() {
                setupLongPress('.service-card');
                setupLongPress('.about-polaroid');
                setupLongPress('.btn');
                setupLongPress('.btn-solid');
                setupLongPress('.service-btn');
                setupLongPress('.social-btn');
                setupLongPress('.cta-btn');
            });
        })();
    </script>
